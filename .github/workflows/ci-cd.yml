# CI/CD de quickpatch-web (panel Angular).
# El CI (SCRUM-337) y el CD (SCRUM-338) viven en este archivo, sin workflows de otros repositorios.
# Qué corre en cada rama:
#   PR a develop        → lint, pruebas y build
#   push develop        → lo mismo
#   push release/*      → además, publica el panel en QA (gateway de QA, VM2)
#   push main           → además, publica el panel en producción (gateway de producción, VM3)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "release/**", main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI propio del repositorio (SCRUM-337): lint, pruebas, cobertura ≥ 80% y build.
  ci:
    name: Lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hay-proyecto: "true"
    env:
      ARTEFACTO: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura
        run: |
          set -o pipefail
          npm run test:ci -- --code-coverage | tee salida-pruebas.txt

      - name: Cobertura mínima
        run: python3 .github/scripts/cobertura.py texto 80 salida-pruebas.txt

      # SCRUM-602: salida de las pruebas (con su resumen de cobertura) e informe de cobertura, descargables desde la ejecución.
      - name: Guardar cobertura y resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-y-resultados
          path: |
            salida-pruebas.txt
            coverage
          if-no-files-found: ignore

      - name: Build de producción
        run: npm run build

      # Angular deja los archivos en dist/<proyecto>/browser; se busca el index.html.
      - name: Ubicar el build
        id: build
        if: env.ARTEFACTO == 'true'
        run: |
          index=$(find dist -name index.html -not -path '*/server/*' | head -1)
          if [ -z "$index" ]; then echo "::error::No se encontró index.html dentro de dist/."; exit 1; fi
          echo "carpeta=$(dirname "$index")" >> "$GITHUB_OUTPUT"

      - name: Guardar el build
        if: env.ARTEFACTO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: ${{ steps.build.outputs.carpeta }}
          retention-days: 7

  # Publica el build del panel (artefacto `panel` del job ci). Corre en el runner self-hosted de VM1, que llega por SSH a las VMs de
  # aplicación (SCRUM-573: cada ambiente sirve su panel con su propio gateway Nginx; VM1 solo es la entrada TLS):
  #   release/* → QA: quickpatch@10.43.98.15 (VM2), /opt/quickpatch/gateway/panel
  #   main      → producción: quickpatch@10.43.98.205 (VM3), /opt/quickpatch/gateway/panel
  # La llave es la del runner (deploy-runner.yml --tags llave-runner). Nginx monta la carpeta, así que se reemplaza el contenido
  # sin reemplazar la carpeta. `tar -m` ignora las fechas de los archivos: la compuerta RNF-08 toma como llegada a QA la fecha de la copia.
  # SEGURIDAD: solo con `push`, nunca con `pull_request`: el repo es público.
  desplegar:
    name: Panel en ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
    needs: ci
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') && needs.ci.outputs.hay-proyecto == 'true'
    runs-on: [self-hosted, vm1, red-laboratorio]
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
    concurrency:
      group: panel-${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: panel

      # RNF-08 (SCRUM-415): producción solo recibe la versión que corre en QA y que pasó las pruebas de sistema
      # después de llegar a QA. El script lo instala deploy-runner.yml en VM1 (infrastructure/CI-CD.md).
      - name: Compuerta RNF-08
        if: env.AMBIENTE == 'produccion'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPUERTA_EXCEPCION: ${{ vars.COMPUERTA_RNF08_EXCEPCION }}
        run: |
          command -v compuerta-qa > /dev/null || { echo "::error::Falta compuerta-qa en el runner: aplicar deploy-runner.yml en VM1."; exit 1; }
          compuerta-qa panel panel

      - name: Publicar
        run: |
          set -o pipefail
          case "$AMBIENTE" in
            produccion) vm=10.43.98.205 ;;
            qa)         vm=10.43.98.15 ;;
            *)          echo "::error::Ambiente desconocido: $AMBIENTE"; exit 1 ;;
          esac
          destino=/opt/quickpatch/gateway/panel
          tar -C panel -cf - . | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "quickpatch@$vm" \
            "find $destino -mindepth 1 -delete && tar -m -C $destino -xf -"
          echo "::notice::Panel publicado en $AMBIENTE (quickpatch@$vm:$destino)."

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [ci, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Validar compuertas
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CI_RESULT" = "success"
          test "$DEP_RESULT" = "success" || test "$DEP_RESULT" = "skipped"

# CI/CD de quickpatch-web (panel Angular).
# El CI vive en este archivo (SCRUM-337). El despliegue (imagen, QA y producción) todavía usa
# los workflows de quickpatch-infrastructure hasta que se traslade (SCRUM-338). Qué corre en cada rama:
#   PR a develop        → lint, pruebas y build
#   push develop        → lo mismo
#   push release/*      → además, publica el panel en QA (VM2)
#   push main           → además, publica el panel en producción (VM1)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "release/**", main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI propio del repositorio (SCRUM-337): lint, pruebas, cobertura ≥ 80% y build.
  ci:
    name: Lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hay-proyecto: "true"
    env:
      ARTEFACTO: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura
        run: |
          set -o pipefail
          npm run test:ci -- --code-coverage | tee salida-pruebas.txt

      - name: Cobertura mínima
        run: python3 .github/scripts/cobertura.py texto 80 salida-pruebas.txt

      - name: Build de producción
        run: npm run build

      # Angular deja los archivos en dist/<proyecto>/browser; se busca el index.html.
      - name: Ubicar el build
        id: build
        if: env.ARTEFACTO == 'true'
        run: |
          index=$(find dist -name index.html -not -path '*/server/*' | head -1)
          if [ -z "$index" ]; then echo "::error::No se encontró index.html dentro de dist/."; exit 1; fi
          echo "carpeta=$(dirname "$index")" >> "$GITHUB_OUTPUT"

      - name: Guardar el build
        if: env.ARTEFACTO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: ${{ steps.build.outputs.carpeta }}
          retention-days: 7

  qa:
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && needs.ci.outputs.hay-proyecto == 'true'
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/deploy-panel.yml@main
    with:
      ambiente: qa

  produccion:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.outputs.hay-proyecto == 'true'
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/deploy-panel.yml@main
    with:
      ambiente: produccion

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/dependency-review.yml@main

  quality-gate:
    name: quality-gate
    if: always()
    needs: [ci, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Validar compuertas
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CI_RESULT" = "success"
          test "$DEP_RESULT" = "success" || test "$DEP_RESULT" = "skipped"

# CI/CD de quickpatch-web (panel Angular).
# El CI (SCRUM-337) y el CD (SCRUM-338) viven en este archivo, sin workflows de otros repositorios.
# Qué corre en cada rama:
#   PR a develop        → lint, pruebas y build
#   push develop        → lo mismo
#   push release/*      → además, publica el panel en QA (VM2)
#   push main           → además, publica el panel en producción (VM1)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "release/**", main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI propio del repositorio (SCRUM-337): lint, pruebas, cobertura ≥ 80% y build.
  ci:
    name: Lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hay-proyecto: "true"
    env:
      ARTEFACTO: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura
        run: |
          set -o pipefail
          npm run test:ci -- --code-coverage | tee salida-pruebas.txt

      - name: Cobertura mínima
        run: python3 .github/scripts/cobertura.py texto 80 salida-pruebas.txt

      - name: Build de producción
        run: npm run build

      # Angular deja los archivos en dist/<proyecto>/browser; se busca el index.html.
      - name: Ubicar el build
        id: build
        if: env.ARTEFACTO == 'true'
        run: |
          index=$(find dist -name index.html -not -path '*/server/*' | head -1)
          if [ -z "$index" ]; then echo "::error::No se encontró index.html dentro de dist/."; exit 1; fi
          echo "carpeta=$(dirname "$index")" >> "$GITHUB_OUTPUT"

      - name: Guardar el build
        if: env.ARTEFACTO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: ${{ steps.build.outputs.carpeta }}
          retention-days: 7

  # Publica el build del panel (artefacto `panel` del job ci). Corre en el runner self-hosted de VM1:
  #   release/* → QA: /opt/quickpatch/qa/panel en VM2, por SSH con la llave que deja deploy-runner.yml
  #   main      → producción: /opt/quickpatch/gateway/panel en VM1, la misma máquina del runner
  # Nginx monta la carpeta, así que se reemplaza el contenido sin reemplazar la carpeta.
  # `tar -m` ignora las fechas de los archivos: los relojes de VM1 y VM2 no están sincronizados.
  # SEGURIDAD: solo con `push`, nunca con `pull_request`: el repo es público.
  desplegar:
    name: Panel en ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
    needs: ci
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') && needs.ci.outputs.hay-proyecto == 'true'
    runs-on: [self-hosted, vm1, red-laboratorio]
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
    concurrency:
      group: panel-${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'produccion' || 'qa' }}
      VM2: 10.43.98.15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: panel

      - name: Publicar
        run: |
          case "$AMBIENTE" in
            produccion)
              destino=/opt/quickpatch/gateway/panel
              find "$destino" -mindepth 1 -delete
              cp -r panel/. "$destino"/
              ;;
            qa)
              destino=/opt/quickpatch/qa/panel
              tar -C panel -cf - . | ssh -o StrictHostKeyChecking=accept-new "quickpatch@$VM2" \
                "find $destino -mindepth 1 -delete && tar -m -C $destino -xf -"
              ;;
          esac
          echo "::notice::Panel publicado en $AMBIENTE ($destino)."

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [ci, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Validar compuertas
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CI_RESULT" = "success"
          test "$DEP_RESULT" = "success" || test "$DEP_RESULT" = "skipped"
